name: Publicar no Supabase

# Aplica as migrations e publica as Edge Functions no projeto iCaixa.
# Precisa de dois segredos no GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN: token pessoal em supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD:  senha do banco do projeto iCaixa
on:
  push:
    branches: [main, fluxo-inicial]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ydszcxystfshgeskenot
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings → Secrets and variables → Actions."
            exit 1
          fi
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Banco (migrations)
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
